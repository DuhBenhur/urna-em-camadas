<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Urna em Camadas: imagem de compartilhamento</title>
<style>
  /* Imagem de compartilhamento (1200×630). Gerada por site/scripts/og.py → site/public/og.jpg
     Desde 26/10/2026: Lula reeleito, com a foto da abertura do site (Ricardo Stuckert / Lula Oficial, CC BY-SA 4.0) numa faixa
     no alto. Por usar a foto, esta imagem também fica sob CC BY-SA 4.0 (o crédito vai no rodapé dela). */
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #140a0a; color: #fff; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; overflow: hidden; }
  .foto { position: relative; height: 318px; background: url("../public/foto/lula-reeleito.jpg") center 40% / cover no-repeat; }
  .foto::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 10, 10, 0) 78%, #140a0a 100%); }
  .texto { position: relative; margin-top: 14px; padding: 0 56px; display: grid; grid-template-columns: 1fr auto; column-gap: 40px; align-items: end; }
  h1 { font-size: 100px; line-height: 1; margin: 0; letter-spacing: -0.02em; font-weight: 800; }
  .numero { border-top: 3px solid #ff716b; padding-top: 10px; font-size: 40px; font-weight: 700; margin-bottom: 8px; }
  .numero span { display: block; font-size: 22px; font-weight: 400; color: rgba(255, 255, 255, 0.82); }
  p { grid-column: 1 / -1; font-size: 29px; line-height: 1.3; margin: 16px 0 0; color: rgba(255, 255, 255, 0.92); }
  .rodape { position: absolute; left: 56px; right: 56px; bottom: 20px; display: flex; justify-content: space-between; gap: 24px; font-size: 17px; color: rgba(255, 255, 255, 0.7); white-space: nowrap; }
</style>
</head>
<body>
  <div class="foto"></div>
  <div class="texto">
    <h1>Lula reeleito</h1>
    <div class="numero">64.256.232 votos<span>51,79% dos votos válidos</span></div>
    <p>No 1º&nbsp;turno, Flávio tinha 2,2&nbsp;milhões de votos a mais. No 2º, Lula virou e venceu por 4,4&nbsp;milhões.</p>
  </div>
  <div class="rodape">
    <span>Urna em Camadas · duhbenhur.github.io/urna-em-camadas</span>
    <span>Foto: Ricardo Stuckert / Lula Oficial, CC BY-SA 4.0</span>
  </div>
</body>
</html>
